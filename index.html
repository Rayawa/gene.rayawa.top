<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>基因工程实验室 V4.1 - 黏性末端修复版</title>
    <style>
        :root { --gene: #2ecc71; --plasmid: #3498db; --site: #f1c40f; --highlight: #fff200; --error: #e74c3c; }
        body { font-family: 'Consolas', 'Monaco', monospace; background: #1e272e; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .lab-panel { width: 1000px; background: #2f3542; padding: 25px; border-radius: 15px; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
        
        .dna-container { background: #000; padding: 60px 20px; border-radius: 10px; margin: 20px 0; min-height: 400px; position: relative; border: 2px solid #444; overflow: hidden; }
        .dna-row { display: flex; justify-content: center; align-items: center; gap: 2px; transition: all 0.6s ease; min-height: 60px; }
        
        .base-unit { display: inline-flex; flex-direction: column; align-items: center; width: 22px; position: relative; transition: all 0.3s; padding: 4px 0; }
        .base-unit b { font-size: 16px; width: 100%; text-align: center; display: block; }
        .base-unit b:nth-child(1) { border-bottom: 1px solid #444; color: #55efc4; } /* 上链 */
        .base-unit b:nth-child(2) { color: #fab1a0; } /* 下链 */
        
        .label-tag { position: absolute; top: -35px; font-size: 10px; white-space: nowrap; padding: 2px 5px; border-radius: 3px; background: rgba(52, 152, 219, 0.8); }
        
        /* 核心修复：黏性末端视觉表现 */
        /* 模拟 5' 伸出 (例如 G|AATTC)，切点在第1个碱基后 */
        .is-cut-left b:nth-child(2), 
        .is-cut-right b:nth-child(1) { opacity: 0.2; filter: blur(1px); } 
        
        /* 只有特定的碱基在切割后保留，形成阶梯 */
        .fragment.cut-active .base-unit.is-site[data-idx="0"] b:nth-child(2) { visibility: hidden; } /* 只有第一列下链消失 */
        .fragment.cut-active .base-unit.is-site:not([data-idx="0"]) b:nth-child(1) { visibility: hidden; } /* 后面所有列上链消失 */

        .is-promoter { background: rgba(231, 76, 60, 0.1); border: 1px dashed #e74c3c; }
        .is-terminator { background: rgba(155, 89, 182, 0.1); border: 1px dashed #9b59b6; }
        .is-gene { background: rgba(46, 204, 113, 0.1); border-top: 2px solid var(--gene); border-bottom: 2px solid var(--gene); }
        .highlight-active { background: rgba(241, 196, 15, 0.3); transform: scale(1.05); z-index: 10; }

        /* 动画 */
        .fragment { display: inline-flex; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        .target-left-fly { transform: translate(-300px, -50px) rotate(-45deg); opacity: 0; }
        .target-right-fly { transform: translate(300px, -50px) rotate(45deg); opacity: 0; }
        .plasmid-waste-fly { transform: translateY(-120px) scale(0); opacity: 0; }
        
        .success-link { transform: translateY(135px); filter: drop-shadow(0 0 15px var(--gene)); }
        .fail-shake { animation: shake 0.5s linear; transform: translateY(100px); }
        @keyframes shake {
            0%, 100% { transform: translateY(100px) translateX(0); }
            25% { transform: translateY(100px) translateX(-10px); }
            75% { transform: translateY(100px) translateX(10px); }
        }

        .controls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 20px 0; }
        .enzyme-chip { background: #3d4653; border: 1px solid #57606f; padding: 12px; border-radius: 6px; cursor: pointer; text-align: center; }
        .enzyme-chip.active { background: var(--site); color: #000; font-weight: bold; }
        
        .btn-group { display: flex; gap: 15px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-cut { background: #f39c12; color: white; }
        .btn-ligate { background: #27ae60; color: white; opacity: 0.4; }
        .btn-random { background: #6c5ce7; width: 180px; }
        #ai-report { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 5px solid var(--site); line-height: 1.6; }
    </style>
</head>
<body>

<div class="lab-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0">🔬 基因工程：黏性末端实战模拟</h3>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-random" onclick="generateRandomProblem()">🎲 随机出题</button>
            <button class="btn btn-reset" onclick="location.reload()" style="background:#7f8c8d; color:white; border:none; padding:0 15px; border-radius:8px; cursor:pointer;">🔄 重置</button>
        </div>
    </div>
    
    <div class="dna-container">
        <div style="font-size: 11px; color: #888; margin-bottom: 5px;">Source: 目的基因供体片段</div>
        <div class="dna-row" id="target-dna"></div>
        
        <div style="font-size: 11px; color: #888; margin-top: 80px; margin-bottom: 5px;">Vector: 质粒载体 (P:启动子 / T:终止子)</div>
        <div class="dna-row" id="plasmid-dna"></div>
    </div>

    <div class="controls" id="enzyme-pool"></div>

    <div class="btn-group">
        <button class="btn btn-cut" id="cut-btn" onclick="handleCut()">第一步：执行限制性核酸内切酶切割</button>
        <button class="btn btn-ligate" id="ligate-btn" onclick="handleLigate()" disabled>第二步：DNA 连接酶尝试拼合</button>
    </div>

    <div id="ai-report" style="display:none">
        <div id="diagnostic-text"></div>
    </div>
</div>

<script>
const enzymeLib = [
    {n:"EcoRI", s:"GAATTC"}, {n:"BamHI", s:"GGATCC"}, {n:"HindIII", s:"AAGCTT"},
    {n:"PstI", s:"CTGCAG"}, {n:"SmaI", s:"CCCGGG"}, {n:"XhoI", s:"CTCGAG"}
];

let currentProblem = {};
let selected = new Set();
let isCut = false;

function generateRandomProblem() {
    isCut = false;
    selected.clear();
    document.getElementById('ligate-btn').disabled = true;
    document.getElementById('ligate-btn').style.opacity = "0.4";
    document.getElementById('ai-report').style.display = "none";

    const shuffled = [...enzymeLib].sort(() => 0.5 - Math.random());
    const pool = shuffled.slice(0, 5);
    const correctEnzymes = [pool[0], pool[1]];
    const distractor = pool[2];

    currentProblem = {
        target: [
            {s:"TAG", type:"waste"},
            {s:correctEnzymes[0].s, e:correctEnzymes[0].n, type:"site"},
            {s:"ATGCGTACGGTGA", t:"is-gene", label:"目的基因 (Target Gene)", type:"core"},
            {s:correctEnzymes[1].s, e:correctEnzymes[1].n, type:"site"},
            {s:"CGC", type:"waste"}
        ],
        plasmid: [
            {s:"TTA", t:"is-promoter", label:"P", type:"stay"},
            {s:correctEnzymes[0].s, e:correctEnzymes[0].n, type:"site"},
            {s:distractor.s, e:distractor.n, type:"waste-mid"},
            {s:correctEnzymes[1].s, e:correctEnzymes[1].n, type:"site"},
            {s:"GGC", t:"is-terminator", label:"T", type:"stay"}
        ],
        correct: [correctEnzymes[0].n, correctEnzymes[1].n]
    };

    renderDNA('target-dna', currentProblem.target);
    renderDNA('plasmid-dna', currentProblem.plasmid);
    initEnzymePool(pool.map(e => e.n));
}

function renderDNA(containerId, data) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    data.forEach((frag, fIdx) => {
        const fragSpan = document.createElement('span');
        fragSpan.className = 'fragment';
        fragSpan.id = `${containerId}-f-${fIdx}`;
        fragSpan.dataset.enzyme = frag.e || "";
        
        frag.s.split('').forEach((base, bIdx) => {
            const unit = document.createElement('div');
            unit.className = `base-unit ${frag.t || ''} ${frag.e ? 'is-site' : ''}`;
            unit.dataset.idx = bIdx; // 记录碱基在识别序列中的位置
            if(frag.label && bIdx === 0) unit.innerHTML += `<span class="label-tag">${frag.label}</span>`;
            unit.innerHTML += `<b>${base}</b><b>${getPair(base)}</b>`;
            fragSpan.appendChild(unit);
        });
        container.appendChild(fragSpan);
    });
}

function getPair(b) { return {A:'T', T:'A', G:'C', C:'G'}[b]; }

function initEnzymePool(names) {
    const poolDiv = document.getElementById('enzyme-pool');
    poolDiv.innerHTML = "";
    names.forEach(name => {
        const div = document.createElement('div');
        div.className = 'enzyme-chip';
        div.innerText = name;
        div.onclick = function() {
            if(isCut) return;
            this.classList.toggle('active');
            selected.has(name) ? selected.delete(name) : selected.add(name);
            updateHighlights();
        };
        poolDiv.appendChild(div);
    });
}

function updateHighlights() {
    document.querySelectorAll('.base-unit.is-site').forEach(unit => {
        const parent = unit.parentElement;
        if(selected.has(parent.dataset.enzyme)) unit.classList.add('highlight-active');
        else unit.classList.remove('highlight-active');
    });
}

function handleCut() {
    if(selected.size === 0) return alert("请先选择限制酶！");
    isCut = true;
    
    // 飞走动画：目的基因的两头飞走
    if(selected.has(currentProblem.target[1].e)) {
        document.getElementById('target-dna-f-0').classList.add('target-left-fly');
        document.getElementById('target-dna-f-1').classList.add('cut-active');
    }
    if(selected.has(currentProblem.target[3].e)) {
        document.getElementById('target-dna-f-4').classList.add('target-right-fly');
        document.getElementById('target-dna-f-3').classList.add('cut-active');
    }
    
    // 质粒位点变化：
    if(selected.has(currentProblem.plasmid[1].e)) document.getElementById('plasmid-dna-f-1').classList.add('cut-active');
    if(selected.has(currentProblem.plasmid[3].e)) document.getElementById('plasmid-dna-f-3').classList.add('cut-active');

    // 质粒中间碎片飞走
    const selArr = Array.from(selected);
    if(selArr.includes(currentProblem.correct[0]) && selArr.includes(currentProblem.correct[1])) {
        document.getElementById('plasmid-dna-f-2').classList.add('plasmid-waste-fly');
    }

    document.getElementById('ligate-btn').disabled = false;
    document.getElementById('ligate-btn').style.opacity = "1";
    showReport("<strong>✂️ 切割成功！</strong><br>注意观察序列两端的“阶梯状”结构，这就是<strong>黏性末端</strong>。只有互补的末端（如 AATT 与 TTAA）才能通过碱基互补配对原则重新连接。");
}

function handleLigate() {
    const sel = Array.from(selected);
    const geneFrag = document.getElementById('target-dna-f-2');
    geneFrag.classList.remove('success-link', 'fail-shake');

    if(sel.length === 2 && sel.includes(currentProblem.correct[0]) && sel.includes(currentProblem.correct[1])) {
        // 成功时让位点视觉复原（表示已经连接上）
        document.querySelectorAll('.fragment.cut-active').forEach(el => el.classList.remove('cut-active'));
        geneFrag.classList.add('success-link');
        showReport("<strong>✅ 连接成功！重组质粒构建完成。</strong><br>AI 诊断：双酶切产生了互补的黏性末端，实现了目的基因的<strong>定向连接</strong>。该质粒现在可以导入受体细胞进行表达了。");
    } 
    else {
        setTimeout(() => geneFrag.classList.add('fail-shake'), 10);
        showReport("<strong>❌ 连接失败：末端不匹配！</strong><br>AI 诊断：限制酶选择错误或不完整。产生的黏性末端无法形成稳定的氢键配对，DNA 连接酶无法将其骨架缝合。");
    }
}

function showReport(txt) {
    document.getElementById('ai-report').style.display = "block";
    document.getElementById('diagnostic-text').innerHTML = txt;
}

generateRandomProblem();
</script>

</body>
</html>
